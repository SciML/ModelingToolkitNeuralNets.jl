# Root test-group matrix for ModelingToolkitNeuralNets.jl, consumed by the
# canonical grouped-tests.yml@v1 caller. "All" runs the functional tests on Julia
# "1" and "lts" across all three OSes. SciMLTesting never runs QA as part of "All",
# so QA has its own group.
[All]
versions = ["1", "lts"]
os = ["ubuntu-latest", "macos-latest", "windows-latest"]

[QA]
versions = ["lts", "1"]

# GPU group: CUDA sub-env on a self-hosted GPU runner (ubuntu only).
[CUDA]
versions = ["1"]
runner = ["self-hosted", "Linux", "X64", "gpu"]
